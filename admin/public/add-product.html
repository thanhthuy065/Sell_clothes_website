<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thêm nhiều sản phẩm | Trang quản trị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      margin-left: 200px;
      margin-right: 200px;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }
    .product-form {
      border: 2px solid #dee2e6;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .preview-img {
      width: 150px;
      height: 150px;
      border: 2px dashed #ccc;
      border-radius: 10px;
      object-fit: cover;
      margin-top: 10px;
    }
    .btn-add, .btn-save {
      font-size: 18px;
      font-weight: 500;
    }
    .remove-btn {
      float: right;
      font-size: 18px;
      color: #dc3545;
      cursor: pointer;
    }
    .remove-btn:hover {
      color: #b21f2d;
    }
  </style>
</head>
<body>
  <h1>🛍️ Thêm sản phẩm</h1>

  <form id="multiProductForm" enctype="multipart/form-data">
    <div id="productFormsContainer"></div>

    <div class="text-center mt-4">
      <button type="button" id="addProductBtn" class="btn btn-outline-primary btn-add">➕ Thêm sản phẩm</button>
      <button type="submit" class="btn btn-success btn-save ms-3">💾 Lưu tất cả</button>
      <a href="admin.html#productsTab" class="btn btn-secondary ms-3">⬅ Quay lại</a>
    </div>
  </form>

<script>
  const API_URL = 'http://localhost:3000/api/products';
  const container = document.getElementById('productFormsContainer');
  const addBtn = document.getElementById('addProductBtn');

  // ✅ Tạo form sản phẩm mới (GIỮ NGUYÊN UI)
  function createProductForm(index) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('product-form');
    wrapper.innerHTML = `
      <span class="remove-btn" onclick="this.closest('.product-form').remove()">✖</span>
      <h5 class="mb-3">Sản phẩm ${index + 1}</h5>

      <div class="mb-3">
        <label class="form-label fw-semibold">Tên sản phẩm</label>
        <input type="text" name="product_name_${index}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Giá (VNĐ)</label>
        <input type="number" name="price_${index}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Ảnh sản phẩm</label>
        <input type="file" name="image_${index}" accept="image/*" class="form-control image-input" required>
        <img class="preview-img" src="https://via.placeholder.com/150?text=Preview" alt="Preview">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Giá khuyến mãi (VNĐ)</label>
        <input type="number" name="price_promotion_${index}" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Mô tả chi tiết</label>
        <textarea name="detail_${index}" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">ID Bộ sưu tập</label>
        <input type="number" name="collection_id_${index}" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold d-block">Tình trạng</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="status_${index}" value="1" checked>
          <label class="form-check-label">Đang hoạt động</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="status_${index}" value="0">
          <label class="form-check-label">Hết hàng</label>
        </div>
      </div>
    `;

    // Preview ảnh
    const fileInput = wrapper.querySelector('.image-input');
    const previewImg = wrapper.querySelector('.preview-img');
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => (previewImg.src = e.target.result);
        reader.readAsDataURL(file);
      } else {
        previewImg.src = 'https://via.placeholder.com/150?text=Preview';
      }
    });

    container.appendChild(wrapper);
  }

  // Form đầu tiên
  createProductForm(0);

  // Thêm form mới
  addBtn.addEventListener('click', () => {
    const index = document.querySelectorAll('.product-form').length;
    createProductForm(index);
  });

  // 🔒 khóa/mở nút trong lúc lưu
  function setSaving(isSaving) {
    document.querySelector('.btn-save').disabled = isSaving;
    addBtn.disabled = isSaving;
  }

  // 💾 Lưu tất cả (GỬI TUẦN TỰ + BẮT LỖI RÕ)
  document.getElementById('multiProductForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const forms = document.querySelectorAll('.product-form');
    if (forms.length === 0) {
      alert('❌ Chưa có sản phẩm nào để lưu.');
      return;
    }

    setSaving(true);

    let success = 0;
    const messages = []; // thu thập kết quả từng sản phẩm

    for (let i = 0; i < forms.length; i++) {
      const form = forms[i];

      // Validate tối thiểu
      const nameEl = form.querySelector(`[name^="product_name_"]`);
      const priceEl = form.querySelector(`[name^="price_"]`);
      const imgEl = form.querySelector(`[name^="image_"]`);
      if (!nameEl.value.trim()) {
        messages.push(`Sản phẩm ${i + 1}: thiếu tên.`);
        continue;
      }
      if (!priceEl.value) {
        messages.push(`Sản phẩm ${i + 1}: thiếu giá.`);
        continue;
      }
      if (imgEl.files.length === 0) {
        messages.push(`Sản phẩm ${i + 1}: thiếu ảnh (bắt buộc).`);
        continue;
      }

      // Build FormData
      const fd = new FormData();
      fd.append('product_name', nameEl.value.trim());
      fd.append('price', priceEl.value);
      fd.append('image', imgEl.files[0]);
      fd.append('price_promotion', form.querySelector(`[name^="price_promotion_"]`).value || 0);
      fd.append('detail', form.querySelector(`[name^="detail_"]`).value || '');
      fd.append('collection_id', form.querySelector(`[name^="collection_id_"]`).value || '');
      fd.append('status', form.querySelector(`[name^="status_"]:checked`).value);

      try {
        const res = await fetch(API_URL, { method: 'POST', body: fd });
        if (res.ok) {
          success++;
          messages.push(`Sản phẩm ${i + 1}: ✅ thành công.`);
        } else {
          const txt = await res.text();
          messages.push(`Sản phẩm ${i + 1}: ❌ thất bại (${res.status}) - ${txt}`);
        }
      } catch (err) {
        messages.push(`Sản phẩm ${i + 1}: ⚠️ lỗi mạng/JS - ${err.message}`);
      }
    }

    setSaving(false);

    // Thông báo chi tiết + tổng kết
    alert(messages.join('\n') + `\n\nKết quả: ${success}/${forms.length} sản phẩm thành công.`);

    // Chuyển về trang admin nếu có ít nhất 1 sp thành công
    window.location.href = 'admin.html#productsTab';
  });
</script>

</body>
</html>
