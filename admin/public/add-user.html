<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Thêm nhiều người dùng | Trang quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            margin-left: 200px;
            margin-right: 200px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .user-form {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .btn-add,
        .btn-save {
            font-size: 18px;
            font-weight: 500;
        }

        .remove-btn {
            float: right;
            font-size: 18px;
            color: #dc3545;
            cursor: pointer;
        }

        .remove-btn:hover {
            color: #b21f2d;
        }
    </style>
</head>

<body>
    <h1>👥 Thêm nhiều người dùng</h1>

    <form id="multiUserForm">
        <div id="userFormsContainer"></div>

        <div class="text-center mt-4">
            <button type="button" id="addUserBtn" class="btn btn-outline-primary btn-add">➕ Thêm người dùng</button>
            <button type="submit" class="btn btn-success btn-save ms-3">💾 Lưu tất cả</button>
            <a href="admin.html#usersTab" class="btn btn-secondary ms-3">⬅ Quay lại</a>
        </div>
    </form>

    <script>
        const API_URL = 'http://localhost:3000/api/users';
        const container = document.getElementById('userFormsContainer');
        const addBtn = document.getElementById('addUserBtn');

        // ✅ Hàm tạo form người dùng mới
        function createUserForm(index) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('user-form');
            wrapper.innerHTML = `
      <span class="remove-btn" onclick="this.closest('.user-form').remove()">✖</span>
      <h5 class="mb-3">Người dùng ${index + 1}</h5>

      <div class="mb-3">
        <label class="form-label fw-semibold">👤 Tài khoản</label>
        <input type="text" name="username_${index}" class="form-control" required placeholder="Nhập tên tài khoản...">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">🔒 Mật khẩu</label>
        <input type="password" name="password_${index}" class="form-control" required placeholder="Nhập mật khẩu...">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">📧 Email</label>
        <input type="email" name="email_${index}" class="form-control" placeholder="Nhập email...">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold d-block">👥 Vai trò</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="role_${index}" value="0" checked>
          <label class="form-check-label">Khách hàng</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="role_${index}" value="1">
          <label class="form-check-label">Người quản trị</label>
        </div>
      </div>
    `;
            container.appendChild(wrapper);
        }

        // ✅ Form đầu tiên mặc định
        createUserForm(0);

        // ➕ Thêm form mới
        addBtn.addEventListener('click', () => {
            const index = document.querySelectorAll('.user-form').length;
            createUserForm(index);
        });

        // ⚙️ Khóa nút khi đang lưu
        function setSaving(isSaving) {
            document.querySelector('.btn-save').disabled = isSaving;
            addBtn.disabled = isSaving;
        }

        // 💾 Gửi lần lượt từng người dùng
        document.getElementById('multiUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const forms = document.querySelectorAll('.user-form');
            if (forms.length === 0) {
                alert('❌ Chưa có người dùng nào để lưu.');
                return;
            }

            setSaving(true);
            let success = 0;
            const messages = [];

            for (let i = 0; i < forms.length; i++) {
                const form = forms[i];
                const username = form.querySelector(`[name^="username_"]`).value.trim();
                const password = form.querySelector(`[name^="password_"]`).value.trim();
                const email = form.querySelector(`[name^="email_"]`).value.trim();
                const role = parseInt(form.querySelector(`[name^="role_"]:checked`).value);

                if (!username || !password) {
                    messages.push(`Người dùng ${i + 1}: ❌ Thiếu tài khoản hoặc mật khẩu.`);
                    continue;
                }

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, email, role })
                    });
                    const result = await res.json();

                    if (res.ok) {
                        success++;
                        messages.push(`Người dùng ${i + 1}: ✅ Thêm thành công.`);
                    } else {
                        messages.push(`Người dùng ${i + 1}: ❌ ${result.message || 'Lỗi không xác định.'}`);
                    }
                } catch (err) {
                    messages.push(`Người dùng ${i + 1}: ⚠️ Lỗi mạng - ${err.message}`);
                }
            }

            setSaving(false);
            alert(messages.join('\n') + `\n\nKết quả: ${success}/${forms.length} người dùng thành công.`);

            if (success > 0) {
                window.location.href = 'admin.html#usersTab';
            }
        });
    </script>

</body>

</html>
